# Sync server on Fly.io. Secrets (DATABASE_URL, ALLOW_ORIGIN, APP_URL, FINNHUB_API_KEY, SEC_USER_AGENT, RESEND_API_KEY,
# MAIL_FROM, FIREBASE_SERVICE_ACCOUNT) are set with `fly secrets set`, never written here.
app = "jod-sync"
primary_region = "sin"

[deploy]
  # Brings the database schema up to date before the new version takes traffic.
  release_command = "npx prisma migrate deploy"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  TRUST_PROXY = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  # One machine stays up: price-alert pushes are checked inside the server every 15 minutes.
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"
